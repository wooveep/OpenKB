name: Windows Portable Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-portable.yml"
      - "desktop/**"
      - "frontend/**"
      - "openkb/desktop_engine.py"
      - "openkb/workbench_service.py"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-portable.yml"
      - "desktop/**"
      - "frontend/**"
      - "openkb/desktop_engine.py"
      - "openkb/workbench_service.py"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  portable-package:
    name: Build and verify portable ZIP
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.13"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build portable package
        shell: pwsh
        run: >-
          ./desktop/scripts/New-PortablePackage.ps1
          -OutputDirectory "$env:RUNNER_TEMP/portable-output"
      - name: Unpack and verify portable package
        shell: pwsh
        run: |
          $zip = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/portable-output" -Filter "OpenKB-*-windows-x64.zip" | Select-Object -First 1
          if (-not $zip) { throw "Portable ZIP was not created." }
          $expanded = Join-Path $env:RUNNER_TEMP "portable-expanded"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $expanded
          $package = Get-ChildItem -LiteralPath $expanded -Directory | Select-Object -First 1
          if (-not $package) { throw "Portable ZIP did not contain a package directory." }
          ./desktop/scripts/Test-PortablePackage.ps1 -PackageDirectory $package.FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openkb-windows-portable
          path: |
            ${{ runner.temp }}/portable-output/*.zip
            ${{ runner.temp }}/portable-output/*.sha256
          if-no-files-found: error
