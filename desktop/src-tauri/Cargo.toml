[package]
name = "openkb-desktop"
version = "0.1.0"
description = "OpenKB Desktop Shell"
authors = ["OpenKB contributors"]
edition = "2021"

[[bin]]
name = "OpenKB"
path = "src/main.rs"

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", default-features = false, features = ["wry", "compression", "common-controls-v6", "dynamic-acl", "x11"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
