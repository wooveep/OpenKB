[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "openkb"
dynamic = ["version"]
description = "OpenKB Desktop: a local, evidence-backed knowledge workbench"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "Apache-2.0"}
authors = [
    {name = "Kylin", email = "quanqi@pageindex.ai"},
    {name = "Ray", email = "ray@vectify.ai"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["ai", "rag", "retrieval", "knowledge-base", "llm", "desktop", "document"]
# All dependencies are pinned exactly (supply-chain caution — e.g. the
# litellm package-poisoning incident). Bump deliberately after vetting
# each release.
dependencies = [
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "xlrd==2.0.2",
    "pymupdf==1.27.2.3",
    "rapidocr-onnxruntime==1.4.4",
    "tika==3.3.2",
    "litellm==1.87.2",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.2",
    "portalocker==3.2.0",
]

[project.urls]
Repository = "https://github.com/wooveep/OpenKB"
Homepage = "https://github.com/wooveep/OpenKB"
Issues = "https://github.com/wooveep/OpenKB/issues"

[project.scripts]
openkb-desktop-engine = "openkb.desktop_engine:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.9.7",
    "mypy==1.15.0",
    "types-PyYAML==6.0.12.20260518",
]
desktop-build = ["pyinstaller==6.22.0"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["openkb"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Start conservative (pyflakes + pycodestyle errors + isort); ratchet up later.
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["openkb"]
# Lenient to start (codebase not previously type-checked); ratchet up over time.
ignore_missing_imports = true
# numpy's bundled stubs (reached transitively through the desktop model
# runtime) use `type X = ...` alias
# statements requiring Python 3.12+ parser support — fatal to the whole run
# (a [syntax] error, not a suppressible diagnostic) when they get parsed. A
# per-module `follow_imports = "skip"` override was experimentally confirmed
# NOT to prevent the parse; only the global default reliably avoids reaching
# that stub, so it stays global rather than scoped narrower.
follow_imports = "skip"
